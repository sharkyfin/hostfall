<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HOSTFALL</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#080e13; touch-action:none; }
    canvas { display:block; width:100%; height:100%; outline:none; image-rendering:auto; }
    #loading { position:fixed; inset:0; display:grid; place-content:center; color:#c6ced3; font:14px monospace; background:#080e13; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="0"></canvas>
  <div id="loading" role="status">Загрузка…</div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const canvas = document.getElementById('unity-canvas');
    const loading = document.getElementById('loading');
    // Keep Retina backing buffers within a strict budget to ensure 60 FPS on WebSim & itch.
    const pixelBudgets = [1280 * 720, 1024 * 576, 896 * 504];
    let tier = 0;
    function resizeCanvas() {
      const width = Math.max(1, canvas.clientWidth);
      const height = Math.max(1, canvas.clientHeight);
      const scale = Math.min(1, Math.sqrt(pixelBudgets[tier] / (width * height)));
      const renderWidth = Math.max(1, Math.floor(width * scale));
      const renderHeight = Math.max(1, Math.floor(height * scale));
      if (canvas.width !== renderWidth || canvas.height !== renderHeight) {
        canvas.width = renderWidth;
        canvas.height = renderHeight;
      }
    }

    // Adapt resolution quickly if frame rate drops below 45 FPS.
    function adaptResolution() {
      const sampleDuration = 1500;
      const minimumFps = 45;
      let start = 0;
      let frames = 0;
      let slowWindows = 0;
      function reset(timestamp = 0) {
        start = timestamp;
        frames = 0;
        slowWindows = 0;
      }
      function sample(timestamp) {
        if (document.hidden || !document.hasFocus()) reset();
        else if (!start) start = timestamp;
        else if (timestamp - start >= sampleDuration) {
          const elapsed = timestamp - start;
          slowWindows = elapsed < sampleDuration * 2 && frames * 1000 / elapsed < minimumFps
            ? slowWindows + 1 : 0;
          start = timestamp;
          frames = 0;
          if (slowWindows >= 2) {
            ++tier;
            resizeCanvas();
            reset(timestamp);
          }
        } else ++frames;
        if (tier < pixelBudgets.length - 1) requestAnimationFrame(sample);
      }
      requestAnimationFrame(sample);
    }

    resizeCanvas();
    new ResizeObserver(resizeCanvas).observe(canvas);

    // Prevent iframe / browser page scrolling when using game keys
    window.addEventListener('keydown', function (e) {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Tab'].includes(e.code)) {
        if (document.activeElement === canvas || document.pointerLockElement === canvas) {
          e.preventDefault();
        }
      }
    });

    function lockEscape() {
      if (document.fullscreenElement && navigator.keyboard && navigator.keyboard.lock) {
        navigator.keyboard.lock(['Escape']).catch(() => {});
      }
    }
    document.addEventListener('fullscreenchange', lockEscape);
    document.addEventListener('webkitfullscreenchange', lockEscape);
    canvas.addEventListener('click', lockEscape);
    createUnityInstance(canvas, {
      arguments: [],
      matchWebGLToCanvasSize: false,
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
#endif
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
    }, progress => { loading.textContent = 'Загрузка… ' + Math.round(progress * 100) + '%'; })
      .then(() => { loading.remove(); canvas.focus(); adaptResolution(); })
      .catch(error => { loading.textContent = 'Не удалось запустить игру. Перезагрузите страницу.'; console.error(error); });
  </script>
</body>
</html>
